<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52">
  <defs>
    <linearGradient id="motaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00153d"/>
      <stop offset="100%" stop-color="#006a63"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Tricolor Emblem Accent Bar -->
  <rect x="2" y="8" width="4" height="12" rx="2" fill="#FF9933"/>
  <rect x="2" y="20" width="4" height="12" rx="0" fill="#FFFFFF" stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="2" y="32" width="4" height="12" rx="2" fill="#138808"/>
  
  <!-- Outer Tribal Chakra Medallion -->
  <circle cx="28" cy="26" r="18" fill="url(#motaGrad)"/>
  <circle cx="28" cy="26" r="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  
  <!-- Central Emblem / Ashoka Chakra Spokes -->
  <circle cx="28" cy="26" r="11" fill="#ffffff" opacity="0.12"/>
  <circle cx="28" cy="26" r="5" fill="url(#goldGrad)"/>
  <circle cx="28" cy="26" r="2.5" fill="#ffffff"/>
  
  <!-- Radiating 8 Cardinal & Diagonal Spokes -->
  <path d="M28 15 L28 21 M28 31 L28 37 M17 26 L23 26 M33 26 L39 26 M20 18 L24 22 M32 30 L36 34 M20 34 L24 30 M32 22 L36 18" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Government Official Typography -->
  <g transform="translate(54, 0)">
    <!-- Primary Title -->
    <text x="0" y="22" font-family="'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#00153d" letter-spacing="0.5">MoTA SETU</text>
    
    <!-- Verified Sovereign Badge Pill -->
    <rect x="94" y="10" width="62" height="14" rx="7" fill="#006a63" fill-opacity="0.12"/>
    <text x="125" y="20.5" text-anchor="middle" font-family="'Public Sans', sans-serif" font-size="8" font-weight="700" fill="#006a63" letter-spacing="0.3">RULE 14(b)</text>
    
    <!-- Subtitle / Ministry Designation -->
    <text x="0" y="36" font-family="'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#44464f" letter-spacing="0.1">जनजातीय कार्य मंत्रालय • GOVT. OF INDIA</text>
    <text x="0" y="47" font-family="'Public Sans', sans-serif" font-size="7.5" font-weight="700" fill="#006a63" letter-spacing="0.4">SOVEREIGN SCRUTINY ENGINE</text>
  </g>
</svg>